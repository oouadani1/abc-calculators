<!doctype html>
<!--
  Local-only dev tool. NOT part of the shipped product, never gets pasted
  anywhere. Paste an embed code snippet (from dist/*.html, or copied via
  a tool's "Copy embed code" button) into the box below to see how it
  actually renders and behaves inside an iframe — which is how it'll be
  loaded on the real ModX page, not how it looks opened directly.

  The "grant clipboard-write" checkbox reproduces the exact bug found in
  the MBTA calculator: browsers block navigator.clipboard.writeText()
  inside a cross-origin iframe unless the iframe's own `allow` attribute
  includes clipboard-write. Toggle it off to confirm a tool's embed
  button still works via its execCommand fallback even without that
  attribute; toggle it on to see the "normal" path.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Embed Code Tester</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
      color: #142433;
    }
    h1 { font-size: 1.25rem; }
    p.hint { color: #5B6B7A; font-size: 0.9rem; }
    textarea {
      width: 100%;
      height: 220px;
      font-family: ui-monospace, monospace;
      font-size: 0.8rem;
      padding: 12px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 12px 0;
    }
    button {
      font-size: 0.95rem;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 999px;
      border: 1px solid #134072;
      background: #134072;
      color: #fff;
      cursor: pointer;
    }
    label { font-size: 0.9rem; display: flex; align-items: center; gap: 6px; }
    iframe {
      width: 100%;
      min-height: 900px;
      border: 2px dashed #ccc;
      border-radius: 8px;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <h1>Embed Code Tester</h1>
  <p class="hint">Paste a full embed snippet below (from a "Copy embed code" button, or a dist/*.html file's contents), then click Render. It loads in a real iframe below, matching how ModX actually serves it.</p>

  <textarea id="input" placeholder="Paste embed HTML here..."></textarea>

  <div class="controls">
    <button id="render">Render in iframe</button>
    <label>
      <input type="checkbox" id="allowClipboard" checked />
      Grant clipboard-write to the iframe (matches an iframe with allow="clipboard-write")
    </label>
  </div>

  <iframe id="preview" title="Embed preview"></iframe>

  <script>
    const input = document.getElementById("input");
    const renderBtn = document.getElementById("render");
    const allowCheckbox = document.getElementById("allowClipboard");
    const preview = document.getElementById("preview");

    function render() {
      preview.setAttribute("allow", allowCheckbox.checked ? "clipboard-write" : "");
      preview.srcdoc = input.value;
    }

    renderBtn.addEventListener("click", render);
    allowCheckbox.addEventListener("change", render);
  </script>
</body>
</html>
